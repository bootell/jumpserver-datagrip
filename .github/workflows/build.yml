name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '27 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test, build, and verify compatibility
        run: xvfb-run -a ./gradlew --no-daemon test buildPlugin verifyPluginStructure verifyPlugin -PverifyLatestRelease=true
      - name: Prepare plugin package
        id: package
        run: |
          shopt -s nullglob
          archives=(build/distributions/jumpserver-datagrip-*.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one plugin ZIP'
            exit 1
          fi
          archive="${archives[0]}"
          filename="${archive##*/}"
          version="${filename#jumpserver-datagrip-}"
          version="${version%.zip}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must be v$version; update the project version before tagging"
            exit 1
          fi
          printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/pluginVerifier/
            build/reports/tests/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload plugin package
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: plugin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="release/jumpserver-datagrip-${RELEASE_TAG#v}.zip"
          [[ -f "$archive" ]] || { echo '::error::Release package is missing'; exit 1; }
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              echo 'Release is already published; leaving it unchanged'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
